<!DOCTYPE html>
<html>
<head><title>Share Document</title></head>
<body>
  <h2>Share "{{ doc.filename }}"</h2>
  {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
  <form method="POST">
    <input type="text" name="username" placeholder="Username to share with" required><br><br>
    <select name="role">
      <option value="viewer">Viewer (can download)</option>
      <option value="editor">Editor (can download)</option>
    </select><br><br>
    <button type="submit">Share</button>
  </form>
  <br><a href="/documents">Back to Documents</a>
</body>
</html>
