<!DOCTYPE html>
<html>
<head><title>Register</title></head>
<body>
  <h2>Create Account</h2>
  {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
  <form method="POST">
    <input type="text"     name="username"         placeholder="Username (3-20 chars)"  required><br><br>
    <input type="email"    name="email"             placeholder="Email"                  required><br><br>
    <input type="password" name="password"          placeholder="Password (min 12 chars)" required><br><br>
    <input type="password" name="confirm_password"  placeholder="Confirm Password"       required><br><br>
    <button type="submit">Register</button>
  </form>
  <small>Password must have 12+ chars, uppercase, lowercase, number, special (!@#$%^&*)</small><br><br>
  <a href="/login">Already have an account? Login</a>
</body>
</html>
