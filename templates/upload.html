{% extends "base.html" %}
{% block title %}Upload Document{% endblock %}

{% block content %}
<div class="container-sm fade-in" style="padding-top:3rem;">
  <div class="page-header">
    <h1>Upload document</h1>
    <p>Files are encrypted with Fernet (AES-128) before storage</p>
  </div>

  {% if error %}
  <div class="alert alert-error">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    {{ error }}
  </div>
  {% endif %}

  <div class="card">
    <form method="POST" enctype="multipart/form-data" action="{{ url_for('upload_document') }}">
      <div class="form-group">
        <label>Select file</label>
        <input type="file" name="file" id="file-input" required />
        <div class="text-muted mt-1">Allowed: pdf, txt, docx, png, jpg &nbsp;·&nbsp; Max: 16 MB</div>
      </div>
      <div class="mt-2" style="display:flex; gap:0.75rem;">
        <button type="submit" class="btn btn-primary">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
          Upload &amp; encrypt
        </button>
        <a href="{{ url_for('documents') }}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
