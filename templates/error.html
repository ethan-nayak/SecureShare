{% extends "base.html" %}
{% block title %}Error{% endblock %}

{% block content %}
<div class="error-page fade-in">
  <div class="error-code">!</div>
  <div class="error-msg">{{ error }}</div>
  <div class="mt-3">
    {% if g.user %}
    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Go to dashboard</a>
    {% else %}
    <a href="{{ url_for('login') }}" class="btn btn-secondary">Back to login</a>
    {% endif %}
  </div>
</div>
{% endblock %}
